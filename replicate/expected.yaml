  T2-CLASS-01:
    decision_rule: "PRE-REG-T2-CLASS-01: criteria C1 (regulatory class, openFDA), C2, C3 (T2-P5 safety placement) and C4 (direction at reached human exposure). Register result: SEPARATE, then DROP nicotinamide. Not scripted as one step (network queries by drug name plus criteria applied to sources)."
    metrics: []

  PRE-REG-SPIKEIN-EPCR-CHECK:
    decision_rule: "Section 8 of PRE_REG_SPIKEIN_EPCR.md re-applied to the published rank counts: smooth each rank's share as (k_r + 0.5)/(N + 1), enforce monotonic non-increase by isotonic regression, then subtract 1e-5 per rank and round, widening the decimals until every value is in (0, 1] and the vector is strictly decreasing. The result must equal the epcr column of the submitted CSV."
    metrics:
      - {name: epcr_vector, expected: [0.533223, 0.413611, 0.001641, 0.001631, 0.001621, 0.001611, 0.001601, 0.001591, 0.001581, 0.001571], tol: exact, source: "spike-in RESULT section 4, and the epcr column of preregistration/rowmap/TRACK1_SUBMISSION_ROWMAP_PROPOSED.csv, the CSV we submitted"}
      - {name: matches_submitted_vector, expected: true, tol: exact, source: "the rule applied to the published counts must give the submitted vector; that is what this step exists to check"}
      - {name: epcr_decimals, expected: 6, tol: exact, source: "spike-in RESULT section 4 ('strictly decreasing at 6 decimals')"}
      - {name: strictly_decreasing, expected: true, tol: exact, source: "spike-in RESULT section 4 ('All values in (0, 1], strictly decreasing at 6 decimals. VERIFIED')"}
      - {name: all_in_unit_interval, expected: true, tol: exact, source: "spike-in RESULT section 4"}
      - {name: primary_N, expected: 300, tol: exact, source: "spike-in RESULT section 2, stratum A"}
      - {name: rank1_recall_from_counts, expected: 0.533, tol: {round: 3}, source: "spike-in RESULT section 2; 160 of 300"}
      - {name: top10_rate_from_counts, expected: 0.947, tol: {round: 3}, source: "spike-in RESULT section 4; 284 of 300"}

  PRE-REG-ROWMAP-CHECK:
    decision_rule: "Decision D-RM-1 of PRE_REG_ROWMAP.md re-applied to the published per-combination points distributions: the winner is the combination with the highest total rank points over the primary strata, ties broken by the simpler construction then the simpler rule; adopt it over the draft R0 x C1 only if (a) the mean gain is at least 2.0 points, (b) the lower end of the Bonferroni-adjusted bootstrap interval over 17 comparisons is above 0, and (c) the gain is non-negative in both primary strata."
    metrics:
      - {name: primary_trials, expected: 779, tol: exact, source: "ROW-MAP RESULT section 2 ('PRIM = A-CH-dec + E-CH-dec, N = 779 trials, 201 genes')"}
      - {name: draft_mean_points, expected: 49.10, tol: {round: 2}, source: "ROW-MAP RESULT section 2, R0 draft under C1"}
      - {name: winner_mean_points, expected: 80.20, tol: {round: 2}, source: "ROW-MAP RESULT section 2, P5 under C3; the figure the Track 1 report quotes as 80.2"}
      - {name: winner, expected: P5xC3, tol: exact, source: "ROW-MAP RESULT section 3, decision D-RM-1"}
      - {name: delta_vs_draft, expected: 31.10, tol: {round: 2}, source: "ROW-MAP RESULT section 3 ('+31.10')"}
      - {name: condition_a_margin, expected: true, tol: exact, source: "ROW-MAP RESULT section 3 (margin met)"}
      - {name: condition_b_gate, expected: true, tol: exact, source: "ROW-MAP RESULT section 3, gate interval [24.26, 37.72]; read from the published result, not recomputed (see the step note)"}
      - {name: condition_c_both_strata, expected: true, tol: exact, source: "ROW-MAP RESULT section 3 ('+30.08 / +32.09')"}
      - {name: verdict, expected: "adopt P5xC3", tol: exact, source: "ROW-MAP RESULT section 3, decision D-RM-1 ('adopt P5 x C3 (margin, gate and per-stratum condition all met)')"}

  PRE-REG-ROWMAP:
    decision_rule: "PRE_REG_ROWMAP.md (sha256 9f7a440d...), decision D-RM-1: over the primary strata, adopt the row-building combination with the highest total rank points if (a) its mean gain over the draft rule R0 x C1 is at least 2.0 points, (b) the lower end of a Bonferroni-adjusted bootstrap interval over 17 comparisons is above 0, and (c) the gain is non-negative in both primary strata; otherwise keep R0 x C1. Result: adopt P5 x C3 (+31.10 points, gate interval [24.26, 37.72], +30.08 and +32.09 per stratum). Rows 4 and 5 of the submission changed; row 1 did not. Not run by the harness: see the step note and replicate/EXTERNAL_STEPS.md."
    metrics: []
    info_note: "The adopted rule changed no row 1 in any of the 18 combinations tested, so for this child the automated score is unchanged; the decision is about expected scores over the trial population. The near-tie is stated plainly in preregistration/rowmap/RESULT.md section 3: P5 x C3 beats P2 x C3 and P3 x C3 by only +0.13 points, and almost all of the gain comes from replacing R0 rather than from the choice among P2, P3 and P5."

  PRE-REG-SPIKEIN-G1:
    rule_file: RANKING_RULE_v4.md
    decision_rule: "Gate G1 of PRE_REG_SPIKEIN_EPCR.md, required before the spike-in was frozen: on the real data with no spike, the parametrised copies of the frozen extraction and consequence scripts and the ranking library used by the spike-in must reproduce the recorded tables and summaries byte for byte. If any part of G1 fails the spike-in may not be used."
    exact_if: [artifact:consequence_fixed, artifact:child_exonic_calls, artifact:ranking_v3_fixed, artifact:ranking_v4_fixed, input:clinvar_vcf, input:hpo_obo, input:hpo_genes_to_phenotype]
    metrics:
      - {name: G1a_consequence_identical, expected: true, tol: exact, source: "spike-in RESULT, gate G1 ('consequence, extraction, v3 and v4 summaries byte-identical'); val_G1.json of the recorded run"}
      - {name: G1b_calls_roundtrip_identical, expected: true, tol: exact, source: "spike-in RESULT, gate G1; val_G1.json"}
