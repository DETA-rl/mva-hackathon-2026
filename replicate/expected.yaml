steps:

  S0.1:
    decision_rule: "Stage 0 fact (not a hypothesis): sex declared by the user (male); read-level check from BAI mapped counts."
    exact_if: [input:bam]
    metrics:
      - {name: chrY_ratio_to_autosome, expected: 0.17, tol: {round: 2}, source: "register: S0.1 ('chrY/autosome 0.17')"}
      - {name: chrX_ratio_to_autosome, expected: 0.61, tol: {round: 2}, source: "register: S0.1 ('chrX/autosome 0.61')"}
    info_note: "*_ratio_to_autosome is the script's raw number: BAI mapped-read count of the chromosome divided by the mean count of the 22 autosomes. It is NOT length-normalised, so a short autosome reads well below 1 (chr19 is about 0.45 of the mean autosome in length); these values are not copy-number estimates. *_per_mb_ratio_to_autosome (added by the harness) divides each count by the chromosome's ungapped GRCh38 length first: autosomes then read near 1 and the single chrX near 0.5. chrY and chrM are not interpretable either way (chrY: repeats shared with chrX and the autosomes draw reads; chrM: many copies per cell). Copy number is tested by H08, DETECT-LIMIT and CNV-V1, not by this step."

  H01:
    decision_rule: "H01 predicts excess reads with the 11-bp tandem duplication at the CEP57 exons; falsified by no junction-spanning reads above background (9 to 13 bp insertions or soft-clips per 1000 reads, CEP57 exons versus a same-size chr11 background window)."
    exact_if: [input:bam]
    metrics:
      - {name: CEP57_reads, expected: 12657, tol: exact, source: "register: H01"}
      - {name: CEP57_ins9_13, expected: 0, tol: exact, source: "register: H01"}
      - {name: CEP57_softclip9_13, expected: 52, tol: exact, source: "register: H01"}
      - {name: CEP57_per1000, expected: 4.1, tol: {round: 1}, source: "register: H01 ('4.1 per 1000')"}
      - {name: background_reads, expected: 12496, tol: exact, source: "register: H01"}
      - {name: background_ins9_13, expected: 0, tol: exact, source: "register: H01"}
      - {name: background_softclip9_13, expected: 55, tol: exact, source: "register: H01"}
      - {name: background_per1000, expected: 4.4, tol: {round: 1}, source: "register: H01 ('4.4 per 1000')"}
      - {name: decision, expected: RULED OUT, tol: exact, tol_alt: exact, source: "register: H01 ('RULED OUT at alignment level'); harness reading: CEP57 rate not above background"}

  H-BATCH:
    decision_rule: "H02 falsified by reference-homozygous with adequate depth at the upstream site; H03 by no discordant or split read cluster; H05 by no consistent low-VAF cluster above the null; H06 by no autozygous segment outside heterochromatin; H12 by no hemizygous LoF call and normal depth."
    exact_if: [input:bam, input:vcf]
    metrics:
      - {name: h02_reads_G, expected: 45, tol: exact, source: "register: H02 ('45 reads, all G (reference)')"}
      - {name: h02_reads_A, expected: 0, tol: exact, source: "register: H02 ('No A')"}
      - {name: decision_h02, expected: RULED OUT, tol: exact, tol_alt: exact, source: "register: H02; harness reading: no alt read at depth >= 20"}
      - {name: h03_bub1b_split_per1k, expected: 1.11, tol: {round: 2}, source: "register: H03 ('split 1.11 vs 0.92 per 1k reads')"}
      - {name: h03_background_split_per1k, expected: 0.92, tol: {round: 2}, source: "register: H03"}
      - {name: h03_bub1b_clip_per1k, expected: 46.2, tol: {round: 1}, source: "register: H03 ('soft-clip>=20 46.2 vs 43.2')"}
      - {name: h03_background_clip_per1k, expected: 43.2, tol: {round: 1}, source: "register: H03"}
      - {name: h03_bub1b_disc_per1k, expected: 14.8, tol: {round: 1}, source: "register: H03 ('discordant 14.8 vs 13.5')"}
      - {name: h03_background_disc_per1k, expected: 13.5, tol: {round: 1}, source: "register: H03"}
      - {name: h05_lowvaf_pct_chr20, expected: 1.37, tol: {round: 2}, source: "register: H05"}
      - {name: h05_lowvaf_pct_chr21, expected: 1.30, tol: {round: 2}, source: "register: H05"}
      - {name: h05_lowvaf_pct_chr22, expected: 1.77, tol: {round: 2}, source: "register: H05"}
      - {name: h05_lowvaf_pct_chr18, expected: 0.17, tol: {round: 2}, source: "register: H05"}
      - {name: h05_lowvaf_pct_chr19, expected: 0.30, tol: {round: 2}, source: "register: H05"}
      - {name: h05_lowvaf_pct_chr1, expected: 0.19, tol: {round: 2}, source: "register: H05"}
      - {name: h06_gap1_chrom, expected: "1", tol: exact, source: "register: H06 (longest het-free gaps chr1, chr9, chr16, then chr19)"}
      - {name: h06_gap1_mb, expected: 18.0, tol: {abs: 0.1}, source: "register: H06 ('chr1 125.2-143.2 Mb')"}
      - {name: h06_gap2_chrom, expected: "9", tol: exact, source: "register: H06"}
      - {name: h06_gap2_mb, expected: 15.0, tol: {abs: 0.1}, source: "register: H06 ('chr9 45.5-60.5 Mb')"}
      - {name: h06_gap3_chrom, expected: "16", tol: exact, source: "register: H06"}
      - {name: h06_gap3_mb, expected: 8.1, tol: {abs: 0.1}, source: "register: H06 ('chr16 38.3-46.4 Mb')"}
      - {name: h06_gap4_chrom, expected: "19", tol: exact, source: "register: H06 ('Next longest is 2.3 Mb (chr19)')"}
      - {name: h06_gap4_mb, expected: 2.3, tol: {abs: 0.1}, source: "register: H06"}
      - {name: h12_naa10_reads_per_kb, expected: 170, tol: exact, source: "register: H12 ('NAA10 170 reads/kb')"}
      - {name: h12_chrX_bg_reads_per_kb, expected: 147, tol: exact, source: "register: H12 ('chrX background 147 reads/kb')"}
      - {name: h12_chr1_bg_reads_per_kb, expected: 300, tol: exact, source: "register: H12 ('chr1 background 300 reads/kb')"}
      - {name: h12_naa10_to_autosome, expected: 0.57, tol: {round: 2}, source: "register: H12 ('ratio to autosome 0.57')"}

  H08:
    decision_rule: "H08 predicts an arm-level depth shift in chr18 or chr19; falsified by flat depth (12 sampled 1 Mb bins per chromosome, normalised to the autosome median)."
    exact_if: [input:bam]
    metrics:
      - {name: ratio_chr18, expected: 0.99, tol: {round: 2}, source: "register: Step 2 (H08)"}
      - {name: ratio_chr19, expected: 1.06, tol: {round: 2}, source: "register: Step 2 (H08)"}
      - {name: ratio_chr20, expected: 1.00, tol: {round: 2}, source: "register: Step 2 (H08)"}
      - {name: ratio_chr21, expected: 1.00, tol: {round: 2}, source: "register: Step 2 (H08)"}
      - {name: ratio_chr22, expected: 1.03, tol: {round: 2}, source: "register: Step 2 (H08)"}
      - {name: ratio_chrX, expected: 0.48, tol: {round: 2}, source: "register: Step 2 (H08)"}
      - {name: sha256_json, expected: 069a60a4d7c9bf3d3921a7580daaf6628dc4fc3969aabfa42262a7329fd0bdfb, tol: exact, source: "harness: stored h08_depth_sampled.json"}

  DETECT-LIMIT:
    decision_rule: "Descriptive: median coefficient of variation of 1 Mb bin depth (40 random bins per autosome) and the smallest whole-chromosome mean-depth shift detectable with 40 bins under a 3-SD rule."
    exact_if: [input:bam]
    metrics:
      - {name: median_cv_1mb, expected: 0.147, tol: {round: 3}, source: "register: Readout detection limit ('median coefficient of variation per 1 Mb bin 0.147')"}
      - {name: min_detectable_shift, expected: 0.07, tol: {round: 2}, source: "register: Readout detection limit ('about 7%')"}
      - {name: sha256_json, expected: f13679b915844945ea30eddc857446d6933e582c465d4a5233e67f22d1920b71, tol: exact, source: "harness: stored detection_limit.json"}

  CNV-V1:
    rule_file: CNV_RULE_v1.md
    decision_rule: "CNV_RULE_v1.md (amended before the run): 1 Mb bins, GC-binned correction, median ratio per chromosome excluding the first and last 5 Mb, clonal-fraction estimate; call only if |f| >= 0.14 and |r - expected| > 3 SE. Falsifier: no whole-chromosome event above the noise floor."
    exact_if: [input:bam, input:fasta]
    metrics:
      - {name: calls, expected: [], tol: exact, source: "register: Copy-number mosaicism rule v1 ('no chromosome called')"}
      - {name: chrX_ratio, expected: 0.4995, tol: {round: 4}, source: "register: Copy-number mosaicism rule v1 ('chrX ratio 0.4995')"}
      - {name: chr19_ratio, expected: 1.026, tol: {round: 3}, source: "register: Copy-number mosaicism rule v1 ('chr19 ... ratio 1.026')"}
      - {name: chr19_f, expected: 0.051, tol: {round: 3}, source: "register: Copy-number mosaicism rule v1 ('f = +0.051')"}
      - {name: sha256_json, expected: 9d354fa876ce6e91e6d96406a5b7bf3fca01a855b532de1b3f1d6c9dce9189d2, tol: exact, source: "harness: stored cnv_calls_v1.json"}

  SV-MANTA:
    decision_rule: "SV_RULE_v1.md: PASS; PR+SR alt >= 4; DEL/DUP/INS >= 50 bp or BND; dosage gene (ClinGen HI3 or TS3). Not automated in this harness yet."
    metrics: []

  H13-SMN:
    decision_rule: "H13: homozygous SMN1 loss ruled out if SMN1-specific bases are present in the reads; copy number 1 versus 2 not resolved. Not automated in this harness yet."
    metrics: []

  M-REG-BORZOI:
    decision_rule: "Regulatory model calibration on 120 GTEx whole-blood eQTL SNVs versus 120 random substitutions within 100 kb of the same genes' TSS (not matched); the ClinVar controls and bootstrap interval of CALIBRATION_RULE.md were not used for this step. Not automated in this harness yet."
    metrics: []

  BLIND-01A:
    decision_rule: "Scope step, no decision rule: every non-reference call of the organiser VCF inside a protein-coding exon (+/-3 bp) of the exon BED is kept. No gene prior selects calls."
    exact_if: [input:vcf, input:exon_bed]
    metrics:
      - {name: n_calls, expected: 87198, tol: exact, source: "register: Genome-wide blind exonic pass ('all 87,198 non-reference calls')"}
      - {name: sha256_child_exonic_calls, expected: fb6c459836b962f74aa1896eeb7124594f8d00d542c4ca7026cc47afc9e928d2, tol: exact, source: "harness: stored output"}

  BLIND-01B:
    decision_rule: "Scope step, no decision rule: gnomAD v4.1 exome frequency for every exonic call, by regional indexed reads of the public sites files (only regions around the calls are read; no call is sent as a query)."
    exact_if: [artifact:child_exonic_calls]
    metrics:
      - {name: rows_total, expected: 87198, tol: exact, source: "register: Genome-wide blind exonic pass ('no duplicates counted: 87,198 rows')"}
      - {name: sha256_part0, expected: 9089795834a86450f89f795b776302d78108b24be83be05674becfec66d40b46, tol: exact, source: "harness: stored output"}
      - {name: sha256_part1, expected: 2b547723489dd1a71f7147040fc28576e2bed6fc7fec52afb03fadf2fe118e67, tol: exact, source: "harness: stored output"}
      - {name: sha256_part2, expected: ef59ab4588ecc0a53c252ebf53de42a0e99fa8abc134bfec3634b20eec401cc5, tol: exact, source: "harness: stored output"}
      - {name: sha256_part3, expected: 8ac870cb6cf7623ca40c3caf15c3c2a0cbaa66387846c2301ab7b3dc7689b3ea, tol: exact, source: "harness: stored output"}

  BLIND-01C:
    decision_rule: "Classes: common or low-frequency (AF >= 0.001), rare (0 < AF < 0.001), unobserved in gnomAD exomes (absent site, alt absent, AC0 after QC, or not in the exome release). Outcome recorded as 'NOT RANKED YET' (no consequence annotation at this stage)."
    exact_if: [artifact:gnomad_parts]
    metrics:
      - {name: rows, expected: 87198, tol: exact, source: "register: Genome-wide blind exonic pass"}
      - {name: class_common_or_low, expected: 71416, tol: exact, source: "register: Genome-wide blind exonic pass"}
      - {name: class_rare, expected: 839, tol: exact, source: "register: Genome-wide blind exonic pass"}
      - {name: class_unobserved, expected: 14943, tol: exact, source: "register: Genome-wide blind exonic pass ('Unobserved in gnomAD exomes ... 14,943'; the 5 chrM calls are inside this count, since 71,416 + 839 + 14,943 = 87,198)"}
      - {name: status_not_in_exome_release, expected: 5, tol: exact, source: "register: Genome-wide blind exonic pass ('Not in exome release (chrM): 5')"}
      - {name: genes_with_2plus_rare_or_unobserved, expected: 2800, tol: exact, source: "register: Genome-wide blind exonic pass ('Genes with at least two rare or unobserved calls: 2,800')"}

  CONSEQ-V1:
    decision_rule: "Consequence of each exonic call on GENCODE v44 canonical protein-coding transcripts, classified from the reference FASTA (synonymous, missense, nonsense, stop_lost, frameshift, in-frame indel, splice_region intronic +/-2, UTR/non-CDS exon). Original script; its minus-strand CDS assembly was later found wrong (C-FIX-01)."
    exact_if: [input:fasta, input:gtf, artifact:gnomad_parts]
    metrics:
      - {name: canonical_transcripts, expected: 19690, tol: exact, source: "register: Consequence step (2026-10-17)"}
      - {name: calls_read, expected: 87198, tol: exact, source: "register: Genome-wide blind exonic pass"}
      - {name: table_rows, expected: 74741, tol: exact, source: "register: C-FIX-01 ('5,101 of 74,741 rows change consequence class')"}
      - {name: protein_altering_rare_first_tx, expected: 487, tol: exact, source: "register: Consequence step ('Protein-altering and rare or unobserved, first canonical transcript per call: 487'). COUNT-487 later withdrew 487 as not reproducible; summarize_consequence.py, the script that printed it, counts the first canonical transcript per call and does reproduce it"}
      - {name: stop_lost_rows, expected: 221, tol: exact, source: "register: LIMIT-STOPLOST ('The original table's 221 stop_lost rows all came from the minus-strand bug')"}
      - {name: by_consequence, expected: {missense: 383, splice_region: 48, frameshift: 25, nonsense: 12, inframe_indel: 14, stop_lost: 5}, tol: exact, source: "register: Consequence step"}
      - {name: homozygous, expected: 64, tol: exact, source: "register: Consequence step ('Homozygous: 64')"}
      - {name: protein_altering_rare_distinct_any_tx, expected: 490, tol: exact, source: "register: WORDING-2026-10-20 ('490/494 on the original'); harness count: distinct calls with at least one protein-altering transcript row"}
      - {name: protein_altering_rare_rows_any_tx, expected: 494, tol: exact, source: "register: WORDING-2026-10-20 ('490/494 on the original'); harness count of (call, transcript) rows"}
      - {name: sha256_table, expected: fccdcc93816ed4242ff8734af458fc19fd11eefdb13551c3c669d12435041b94, tol: exact, source: "harness: stored output"}

  C-FIX-01:
    decision_rule: "Bug: CDS segments of minus-strand transcripts were reversed before the whole-string reverse complement. Fixed copy (no reversal) re-run on the same calls; original table kept. Effect reported as the count of rows whose consequence class changes."
    exact_if: [input:fasta, input:gtf, artifact:gnomad_parts]
    metrics:
      - {name: canonical_transcripts, expected: 19690, tol: exact, source: "register: Consequence step"}
      - {name: table_rows, expected: 74741, tol: exact, source: "register: C-FIX-01"}
      - {name: rows_changed, expected: 5101, tol: exact, source: "register: C-FIX-01"}
      - {name: "change missense->synonymous", expected: 3213, tol: exact, source: "register: C-FIX-01"}
      - {name: "change synonymous->missense", expected: 1398, tol: exact, source: "register: C-FIX-01"}
      - {name: "change nonsense->synonymous", expected: 165, tol: exact, source: "register: C-FIX-01"}
      - {name: "change stop_lost->synonymous", expected: 131, tol: exact, source: "register: C-FIX-01"}
      - {name: "change stop_lost->missense", expected: 89, tol: exact, source: "register: C-FIX-01"}
      - {name: "change nonsense->missense", expected: 83, tol: exact, source: "register: C-FIX-01"}
      - {name: "change missense->nonsense", expected: 14, tol: exact, source: "register: C-FIX-01"}
      - {name: "change synonymous->nonsense", expected: 7, tol: exact, source: "register: C-FIX-01 (the eight listed transitions sum to 5,100, one less than 5,101)"}
      - {name: "change stop_lost->nonsense", expected: 1, tol: exact, source: "register: LIMIT-STOPLOST ('131 synonymous, 89 missense, 1 nonsense'; the C-FIX-01 entry omits the 1)"}
      - {name: stop_lost_rows, expected: 0, tol: exact, source: "register: LIMIT-STOPLOST ('corrected table 0 stop_lost rows')"}
      - {name: protein_altering_rare_distinct_any_tx, expected: 481, tol: exact, source: "register: WORDING-2026-10-20 ('481 distinct, 485 rows'); harness count: distinct calls with at least one protein-altering transcript row"}
      - {name: protein_altering_rare_rows_any_tx, expected: 485, tol: exact, source: "register: WORDING-2026-10-20 ('481 distinct, 485 rows'); harness count of (call, transcript) rows"}
      - {name: sha256_table, expected: fc733935f8462fbbd6c09fd3c6c626560eb2fbe83248331edc76ee96734a1dc7, tol: exact, source: "harness: stored output"}

  C-FIX-01-FU:
    decision_rule: "compound_check on both tables: genes with a rare/unobserved LoF-type het and a missense het (at least 2 het calls), phase unknown. Claim checked: the genome-wide version of this check does not single out BUB1B."
    exact_if: [artifact:consequence_orig, artifact:consequence_fixed]
    metrics:
      - {name: compound_genes_original, expected: 7, tol: exact, source: "register: C-FIX-01 follow-up ('has 7 genes in both')"}
