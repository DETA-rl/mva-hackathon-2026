  RANK-V3:
    rule_file: RANKING_RULE_v3.md
    decision_rule: "RANKING_RULE_v3.md: tier A = a candidate call matching a ClinVar Pathogenic/Likely_pathogenic record; tier B = LoF-type plus missense, >= 2 calls; tier C = other v2-passing genes; within tier by v2 score. Ablation A0 (v2 only) and shuffled-ClinVar baseline (seed 1)."
