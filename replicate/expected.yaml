      - {name: bub1b_consequences_original, expected: [missense, nonsense], tol: set, source: "register: C-FIX-01 follow-up ('BUB1B keeps both calls ... under both tables')"}
      - {name: bub1b_consequences_corrected, expected: [missense, nonsense], tol: set, source: "register: C-FIX-01 follow-up"}
      - {name: compound_gene_list_corrected, expected: [BUB1B, PRDM9, HLA-DRB1, EIF4EBP1, POU6F2, HRNR], tol: subset, source: "register: C-FIX-01 follow-up ('PRDM9, HLA-DRB1, EIF4EBP1, POU6F2 and HRNR show the same pattern genome-wide')"}

