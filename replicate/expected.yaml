  T1-CANDIDATE:
    decision_rule: "Harness step (not a register test): the candidate gene is rank 1 of ranking v4 with Amendment 1 on the corrected table (RANK-V4BF); its calls are the gene's rare/unobserved protein-altering calls (first canonical transcript per call). Downstream read-level, phasing and model steps take the candidate from here, so no coordinate is written in code. Protein notation is computed with the corrected consequence code."
    exact_if: [artifact:ranking_v4b_fixed, artifact:consequence_fixed]
    metrics:
      - {name: gene, expected: BUB1B, tol: exact, source: "register: Ranking v4 / C-FIX-01 (BUB1B rank 1)"}
      - {name: n_calls, expected: 2, tol: exact, source: "register: Consequence step ('BUB1B: nonsense ... and missense ...')"}
      - {name: consequences, expected: [missense, nonsense], tol: set, source: "register: Consequence step"}
      - {name: protein_changes_sha256, expected: cabc02ce4457dc5e8723c6101fa1d68180878bf3d13bad43841cea76bf94c166, tol: exact, source: "register: Read-level check (the two protein changes named there); stored as the sha256 of the sorted, comma-joined protein changes so that the child's alleles are not written in this file"}
      - {name: all_heterozygous, expected: true, tol: exact, source: "register: Frequency step ('Both het in the child')"}

  READCHECK:
    decision_rule: "Read-level check of the two candidate calls in our alignment (base quality >= 20, duplicates and secondary alignments excluded): depth, alt reads, alt fraction, alt mapping quality, alt strand. Interpretation recorded: consistent with heterozygous; does not establish phase or pathogenicity."
    exact_if: [input:bam]
    metrics:
      - {name: nonsense_depth, expected: 47, tol: exact, source: "register: Read-level check of the two BUB1B calls"}
      - {name: nonsense_alt_reads, expected: 26, tol: exact, source: "register: Read-level check"}
      - {name: nonsense_alt_fraction, expected: 0.55, tol: {round: 2}, source: "register: Read-level check ('26 (55%)')"}
      - {name: nonsense_alt_mapq_median, expected: 60, tol: exact, source: "register: Read-level check"}
      - {name: nonsense_alt_fwd, expected: 14, tol: exact, source: "register: Read-level check"}
      - {name: nonsense_alt_rev, expected: 12, tol: exact, source: "register: Read-level check"}
      - {name: missense_depth, expected: 27, tol: exact, source: "register: Read-level check"}
      - {name: missense_alt_reads, expected: 12, tol: exact, source: "register: Read-level check"}
      - {name: missense_alt_fraction, expected: 0.44, tol: {round: 2}, source: "register: Read-level check ('12 (44%)')"}
      - {name: missense_alt_mapq_median, expected: 60, tol: exact, source: "register: Read-level check"}
      - {name: missense_alt_fwd, expected: 4, tol: exact, source: "register: Read-level check"}
      - {name: missense_alt_rev, expected: 8, tol: exact, source: "register: Read-level check"}
      - {name: nonsense_consistent_with_het, expected: true, tol: exact, tol_alt: exact, source: "register: Read-level check ('Consistent with heterozygous'); harness reading: alt fraction 0.25 to 0.75 and alt reads on both strands"}
      - {name: missense_consistent_with_het, expected: true, tol: exact, tol_alt: exact, source: "register: Read-level check; same harness reading"}
      - {name: sha256_readcheck_json, expected: 36a5d2022ca49f266f5d2ab32af57e4c97a8762b2b1e59067047932729352a17, tol: exact, source: "harness: stored output"}

  P1:
    decision_rule: "PRE-REG-2026-10-20 P1 [coordinates removed]: list heterozygous SNVs between the two candidate sites from the organiser VCF; for each adjacent het pair count read pairs (insert <= 800 bp, MAPQ >= 30, base quality >= 20) carrying both alleles; connected if a chain of het pairs each with >= 5 informative bridging read pairs links the two sites, else UNRESOLVED; if connected, trans/cis at >= 90% concordance, else UNRESOLVED. As run: a fragment-span (|TLEN|) survey, which already shows that no template can bridge the gaps."
    exact_if: [input:bam, input:vcf]
    metrics:
      - {name: het_snvs_in_interval, expected: 3, tol: exact, source: "register: P1 RESULT"}
      - {name: read1_templates, expected: 2029, tol: exact, source: "register: P1 RESULT ('2,029 read-1 templates')"}
      - {name: max_abs_tlen, expected: 1590, tol: exact, source: "register: P1 RESULT ('largest insert 1,590 bp')"}
      - {name: gap1_bp, expected: 6769, tol: exact, source: "register: P1 RESULT ('Spanning ... needs >= 6,769 bp')"}
      - {name: gap2_bp, expected: 4441, tol: exact, source: "register: P1 RESULT ('spanning ... needs >= 4,441 bp'; repeated in P1-CODE-DEVIATION)"}
      - {name: templates_spanning_gap1, expected: 0, tol: exact, source: "register: P1 RESULT ('Zero templates bridge either gap')"}
      - {name: templates_spanning_gap2_upper_bound, expected: 0, tol: exact, tol_alt: exact, source: "register: P1 RESULT; harness: 0 whenever the largest |TLEN| is below the gap"}
      - {name: decision, expected: UNRESOLVED, tol: exact, tol_alt: exact, source: "register: P1 RESULT ('UNRESOLVED (by the pre-registered method's limits)')"}

  P2:
    decision_rule: "PRE-REG-2026-10-20 P2: every non-reference call in 18 pre-set genes (RNU4ATAC, RNU6ATAC, ZRSR2, SNRNP48, ESCO2, PCNT, CENPF, BUB1B, TRIP13, CEP57, SMC5, MAD1L1, CEP192, TRIM37, CDC20, MAD2L1BP, CENATAC, SLF2). A gene is flagged if it carries (a) a homozygous rare call, or (b) two rare heterozygous protein-altering or splice calls. Descriptive only. Harness reading of the flag rule on the corrected consequence table: rare = rare or unobserved; (a) is applied to protein-altering calls, as in the register result."
    exact_if: [input:vcf, artifact:gnomad_parts, artifact:consequence_fixed]
    metrics:
      - {name: genes_reported, expected: 18, tol: exact, source: "register: P2 RESULT ('Scope: 18 genes')"}
      - {name: RNU4ATAC_nonref_calls, expected: 0, tol: exact, source: "register: P2 RESULT ('RNU4ATAC and RNU6ATAC: zero calls')"}
      - {name: RNU6ATAC_nonref_calls, expected: 0, tol: exact, source: "register: P2 RESULT"}
      - {name: genes_with_rare_protein_altering_calls, expected: [BUB1B], tol: set, source: "register: P2 RESULT ('only BUB1B ... No other gene in the set has a rare protein-altering exonic call')"}
      - {name: bub1b_rare_protein_altering, expected: [missense, nonsense], tol: set, source: "register: P2 RESULT"}
      - {name: flagged_genes, expected: [BUB1B], tol: set, source: "register: P2 RESULT ('BUB1B flagged (the known pair). No other gene flagged.')"}

  P3:
    decision_rule: "PRE-REG-2026-10-20-C: c.803A>T POSITIVE if >= 3 alt reads (MAPQ >= 30) at the mapped position; c.805+2_805+19del18 POSITIVE if >= 3 junction-spanning split reads (MAPQ >= 30); NEGATIVE if zero; otherwise INDETERMINATE. Disclosed deviation: the deletion cutoff in the script is 15 bp (looser than 18 bp)."
    exact_if: [input:bam, input:vcf, input:gtf, input:fasta]
    metrics:
      - {name: transcript, expected: ENST00000334418.6, tol: exact, source: "register: PRE-REG-C RESULT"}
      - {name: strand, expected: "+", tol: exact, source: "register: PRE-REG-C RESULT"}
      - {name: c803_reference_base, expected: A, tol: exact, tol_alt: exact, source: "register: PRE-REG-C RESULT ('reference A, matching the expected A')"}
      - {name: vcf_records_at_c803, expected: 0, tol: exact, source: "register: PRE-REG-C RESULT ('VCF has no record at this position')"}
      - {name: bam_reads_c803, expected: 51, tol: exact, source: "register: PRE-REG-C RESULT ('51 BAM reads with MAPQ >= 30 and BQ >= 20, all A')"}
      - {name: bam_alt_reads_c803, expected: 0, tol: exact, source: "register: PRE-REG-C RESULT"}
      - {name: split_reads_15bp, expected: 0, tol: exact, source: "register: PRE-REG-C RESULT"}
      - {name: decision_c803AT, expected: NEGATIVE, tol: exact, tol_alt: exact, source: "register: PRE-REG-C RESULT"}
      - {name: decision_del18, expected: NEGATIVE, tol: exact, tol_alt: exact, source: "register: PRE-REG-C RESULT"}

