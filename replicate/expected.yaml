  PRE-REG-SPIKEIN-TRIALS:
    rule_file: RANKING_RULE_v4.md
    decision_rule: "Sections 3 to 6 of PRE_REG_SPIKEIN_EPCR.md: mask the two candidate rows out of the child's exonic background, build the eligible spike pool from public ClinVar Pathogenic / Likely pathogenic records, enumerate the eight strata with the pre-registered seeds, then re-run the frozen consequence step and ranking rules v3 and v4 once per trial. Sanity checks S1 to S3 must pass before the trial loop starts."
    exact_if: [artifact:consequence_fixed, artifact:child_exonic_calls, input:clinvar_vcf, input:hpo_obo, input:hpo_genes_to_phenotype, input:vcf]
    metrics:
      - {name: prereg_sha256, expected: 6d40e58fe2d34d92fa9ff42b7171ad5034b45c2409591779c4cc3775650ede69, tol: exact, source: "spike-in RESULT, first line; preregistration/frozen/SHA256SUMS.txt. The step hashes the shipped frozen file, so this also checks that the pre-registration in this repository is the one the run recorded"}
      - {name: child_vcf_unchanged, expected: true, tol: exact, source: "spike-in RESULT ('Child VCF sha256 before and after ... unchanged. VERIFIED')"}
      - {name: removed_rows, expected: 2, tol: exact, source: "run.log ('masked rows removed: 2'); the two candidate rows"}
      - {name: S1_bub_keys_absent, expected: true, tol: exact, source: "spike-in RESULT, check S1"}
      - {name: S1_no_bub1b_candidate, expected: true, tol: exact, source: "spike-in RESULT, check S1"}
      - {name: S1_bub1b_not_ranked, expected: true, tol: exact, source: "spike-in RESULT, check S1"}
