    decision_rule: "CALIBRATION_RULE.md section 2: AUC of P vs B with score = -delta; 95% CI from 2,000 stratified percentile bootstrap resamples (seed 1). Informative only if the CI lower bound is above 0.7; 0.6 to 0.7 exploratory; below 0.6 not used. Missense and nonsense subsets are post hoc and exploratory."
    exact_if: [artifact:evo2_control_scores, artifact:controls_rule]
    metrics:
      - {name: all_nP_nB, expected: [100, 98], tol: exact, source: "register: M-EVO2-CAL-01"}
      - {name: all_auc, expected: 0.677, tol: exact, tol_alt: {abs: 0.02}, source: "register: M-EVO2-CAL-01"}
      - {name: all_ci, expected: [0.602, 0.748], tol: exact, tol_alt: {abs: 0.03}, source: "register: M-EVO2-CAL-01"}
      - {name: missense_auc, expected: 0.797, tol: exact, tol_alt: {abs: 0.02}, source: "register: M-EVO2-CAL-01 (post hoc)"}
      - {name: missense_ci, expected: [0.698, 0.875], tol: exact, tol_alt: {abs: 0.03}, source: "register: M-EVO2-CAL-01 (post hoc)"}
      - {name: nonsense_auc, expected: 0.638, tol: exact, tol_alt: {abs: 0.02}, source: "register: M-EVO2-CAL-01 (post hoc)"}
      - {name: nonsense_ci, expected: [0.522, 0.747], tol: exact, tol_alt: {abs: 0.03}, source: "register: M-EVO2-CAL-01 (post hoc)"}
      - {name: verdict, expected: EXPLORATORY, tol: exact, tol_alt: exact, source: "register: M-EVO2-CAL-01 ('lower bound 0.602 is between 0.6 and 0.7 -> EXPLORATORY, not informative')"}

