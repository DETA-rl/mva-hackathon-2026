      - {name: S3_bub1b_v4_rank, expected: 1, tol: exact, source: "spike-in RESULT, check S3 ('adding the real pair back puts BUB1B at v4 rank 1')"}
      - {name: S3_bub1b_v3_rank, expected: 1, tol: exact, source: "spike-in RESULT, check S3"}
      - {name: S3_v4_order_equals_unspiked, expected: true, tol: exact, source: "spike-in RESULT, check S3 ('full v4 and v3 orders equal the unspiked orders')"}
      - {name: S3_v3_order_equals_unspiked, expected: true, tol: exact, source: "spike-in RESULT, check S3"}
      - {name: masked_v4_top10, expected: [LZTR1, GNRHR, POU6F2, EIF4EBP1, HRNR, IGBP1, ADAMTS1, AGAP3, FOXO6, ADPRHL1], tol: exact, source: "spike-in RESULT section 1 ('Masked v4 top 10: the competition every spike faces')"}
