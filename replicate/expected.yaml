      - {name: mean_fmax, expected: 0.843, tol: {round: 3}, source: "spike-in RESULT section 4 ('mean F-max 0.843')"}
      - {name: ordinal_vector_identical, expected: true, tol: exact, source: "spike-in RESULT section 4 ('Rescoring with the ordinal vector (11 - r)/11 gives identical points and F-max in every trial. VERIFIED')"}
      - {name: decision_D1, expected: "partly robust", tol: exact, source: "spike-in RESULT section 3, D1"}
      - {name: decision_D1_falsified, expected: true, tol: exact, source: "spike-in RESULT section 3 ('H-SPK-1 falsified (0.533 < 0.80)') and the report abstract ('the pre-registered bar was not met')"}
      - {name: decision_D2, expected: "finds without ClinVar", tol: exact, source: "spike-in RESULT section 3, D2"}
      - {name: decision_D2_falsified, expected: false, tol: exact, source: "spike-in RESULT section 3, D2 (top-10 0.790 against a bar of 0.50)"}
      - {name: decision_D3_known_limitation_falsified, expected: false, tol: exact, source: "spike-in RESULT section 3, D3 (the stop-loss limitation is confirmed, not falsified)"}
      - {name: decision_D3_blind_spot, expected: true, tol: exact, source: "spike-in RESULT section 3, D3 ('Blind spot, must be listed in the methods')"}
      - {name: decision_D4, expected: "separates", tol: exact, source: "spike-in RESULT section 3, D4 (0.533 - 0.010 = 0.523 against a gap bar of 0.20)"}
      - {name: decision_D5, expected: "harm", tol: exact, source: "spike-in RESULT section 3, D5 ('harm in stratum A: v4 0.533 vs v3 0.840'); H-SPK-5 falsified"}
      - {name: decision_D6_gate, expected: true, tol: exact, source: "spike-in RESULT section 3, D6 (adoption gate: G1, S1 to S3, N_A = 300)"}
      - {name: decision_D7, expected: "conservative for BUB1B row", tol: exact, source: "spike-in RESULT section 3, D7 (A-BUB rank-1 recall 1.000 > 0.533)"}
      - {name: sha256_summary, expected: e7d7b536d0b150c98809faa1aac43d5cf3ab29e432477ba19899dcb164806c63, tol: exact, source: "harness: stored output; the sha256 quoted in the spike-in RESULT header"}
    info_note: "EPCR is a rank-slot calibration, not a per-gene probability: EPCR_r is the measured probability that a spiked causal lands at rank r in this background, so EPCR_2 describes the slot behind the strongest phenotype-matched tier-A gene rather than the probability that the gene actually at row 2 is causal. Section 5 of the spike-in RESULT states this. Because the organisers' score ignores the magnitudes once the vector is strictly decreasing, the values affect only what the methods text may claim."
