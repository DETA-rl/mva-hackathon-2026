# Expected values for every replication step, copied from the authors' record of truth.
#
# source "register: <entry>"  = HYPOTHESIS_REGISTER.md, the append-only register kept during the analysis
#                               (entry headings quoted; the register itself is not shipped because it holds
#                               read-level values and the full working record rather than only the submitted
#                               content).
# source "harness: ..."       = recorded by this harness from the authors' stored output of the original run
#                               (2026-10-20), for values the register does not state (mostly file hashes).
#
# Tolerances: exact | set (same members, any order) | subset (expected members all present) |
#   {round: k} (observed rounded to k decimals equals expected) | {sigfig: k} | {abs: x} | {rel: x} | {lt: x}
# exact_if: the listed inputs/artifacts must have the expected sha256 for `tol` to apply. If one differs
#   (for example a BAM from a fresh alignment), `tol_alt` applies when given; otherwise the metric is reported
#   as NOT COMPARABLE instead of PASS or FAIL.
# No genomic coordinate, sample identifier or protein change of the child appears in this file. The candidate's
# protein changes are compared through their sha256 (T1-CANDIDATE) and reported under the generic name
# 'candidate_missense' (PRE-REG-D).

