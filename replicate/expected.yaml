    decision_rule: "RANKING_RULE_v4.md (run 1, before Amendment 1): v3 tiers; within tier by phenotype score (child's 8 HPO terms matched through is_a ancestry), then v2 score. Ablations P0, P-only, shuffled (seed 1)."
