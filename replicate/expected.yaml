  PRE-REG-SPIKEIN:
    rule_file: RANKING_RULE_v4.md
    decision_rule: "Sections 7 to 9 of PRE_REG_SPIKEIN_EPCR.md applied to the trial table: per-stratum rank-1 recall and top-10 rate with Jeffreys 95% intervals, the paired McNemar comparison of v4 against v3, the EPCR vector (add-half smoothing, isotonic regression, then a 1e-5 per-rank tie-break so the vector is strictly decreasing at 6 decimals), and the seven pre-registered decisions D1 to D7. Bars as pre-registered: D1 rank-1 recall 0.80, D2 top-10 0.50, D4 gap 0.20, D5 0.05 with McNemar p < 0.05."
    exact_if: [artifact:spikein_trials]
    metrics:
      - {name: epcr_vector, expected: [0.533223, 0.413611, 0.001641, 0.001631, 0.001621, 0.001611, 0.001601, 0.001591, 0.001581, 0.001571], tol: exact, source: "spike-in RESULT section 4, the EPCR column; this is the epcr column of the submitted CSV and of the Track 1 report's row table"}
      - {name: epcr_decimals, expected: 6, tol: exact, source: "spike-in RESULT section 4 ('strictly decreasing at 6 decimals')"}
      - {name: A_v4_N, expected: 300, tol: exact, source: "spike-in RESULT section 2, stratum A"}
      - {name: A_v4_rank1_recall, expected: 0.533, tol: {round: 3}, source: "spike-in RESULT section 2 and the Track 1 report abstract ('rank-1 recall was 0.533')"}
      - {name: A_v4_rank1_ci, expected: [0.477, 0.589], tol: {round: 3}, source: "spike-in RESULT section 2, Jeffreys 95% interval [0.477, 0.589]"}
      - {name: A_v4_top10, expected: 0.947, tol: {round: 3}, source: "spike-in RESULT section 4 ('P(causal in top 10) = 284/300 = 0.947')"}
      - {name: A_v4_top10_ci, expected: [0.917, 0.968], tol: {round: 3}, source: "spike-in RESULT section 4"}
      - {name: A_v4_rank_dist_1_10, expected: {'1': 160, '2': 124, '3': 0, '4': 0, '5': 0, '6': 0, '7': 0, '8': 0, '9': 0, '10': 0}, tol: exact, source: "spike-in RESULT section 2, stratum A rank distribution (160, 124, 0, 0, 16 not ranked)"}
      - {name: A_v4_not_ranked, expected: 16, tol: exact, source: "spike-in RESULT section 4 ('The 16 misses are all RNU4ATAC (non-coding)')"}
      - {name: A_v3_rank1_recall, expected: 0.840, tol: {round: 3}, source: "spike-in RESULT section 2, stratum A v3 rank-1 recall"}
      - {name: A_BUB_v4_rank1_recall, expected: 1.0, tol: exact, source: "spike-in RESULT section 2, stratum A-BUB, and the report abstract ('1.000 for other BUB1B pairs')"}
      - {name: B_v4_rank1_recall, expected: 0.0, tol: exact, source: "spike-in RESULT section 2, stratum B, and the report abstract ('0.000 with ClinVar hidden')"}
      - {name: B_v4_top10, expected: 0.790, tol: {round: 3}, source: "spike-in RESULT section 2, stratum B top-10 0.790"}
      - {name: C1_v4_rank1_recall, expected: 0.05, tol: {round: 3}, source: "spike-in RESULT section 2, stratum C1"}
      - {name: C2_HOM_v4_top10, expected: 0.0, tol: exact, source: "spike-in RESULT section 2, stratum C2-HOM (the stop-loss blind spot)"}
      - {name: C2_CH_v4_rank1_recall, expected: 0.341, tol: {round: 3}, source: "spike-in RESULT section 2, stratum C2-CH"}
      - {name: D_v4_rank1_recall, expected: 0.010, tol: {round: 3}, source: "spike-in RESULT section 2, stratum D (control: recessive genes with no phenotype match)"}
      - {name: D_v3_rank1_recall, expected: 0.760, tol: {round: 3}, source: "spike-in RESULT section 2, stratum D under v3; the specificity the phenotype layer buys"}
      - {name: E_v4_N, expected: 300, tol: exact, source: "spike-in RESULT section 2, stratum E"}
      - {name: E_v4_rank1_recall, expected: 0.857, tol: {round: 3}, source: "spike-in RESULT section 2, stratum E (recessive genes WITH a phenotype match, not in the MVA set)"}
      - {name: D3_stop_alleles, expected: 311, tol: exact, source: "spike-in RESULT section 3, decision D3"}
      - {name: D3_labelled_stop_lost, expected: 0, tol: exact, source: "spike-in RESULT section 3 ('0/311 stop-loss alleles labelled stop_lost')"}
      - {name: D3_stop_allele_candidate, expected: 8, tol: exact, source: "spike-in RESULT section 3 ('a ranked candidate in 8/311 = 2.6%')"}
      - {name: D5_v4_only, expected: 9, tol: exact, source: "spike-in RESULT section 3, decision D5 ('discordant pairs 9 (v4 only) vs 101 (v3 only)')"}
      - {name: D5_v3_only, expected: 101, tol: exact, source: "spike-in RESULT section 3, decision D5"}
      - {name: D5_mcnemar_exact_p, expected: 7.8e-21, tol: {sigfig: 2}, source: "spike-in RESULT section 3 ('McNemar exact p = 7.8e-21')"}
